<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Reply animated Orbit motif"><title>Reply animated Orbit motif</title><style>@keyframes unfold{from{transform:rotate(-150deg) scale(.35)}to{transform:rotate(0) scale(1)}}.motif{transform-origin:120px 120px;animation:unfold 3200ms cubic-bezier(.16,1,.3,1) both}@media(prefers-reduced-motion:reduce){.motif{animation:none}}</style><g class="motif" transform="translate(24 24)"><circle cx="48" cy="48" r="43" fill="#e2d8ec"/><circle cx="144" cy="48" r="43" fill="#e2d8ec"/><circle cx="48" cy="144" r="43" fill="#ef916f"/><circle cx="144" cy="144" r="43" fill="#e2d8ec"/></g></svg>