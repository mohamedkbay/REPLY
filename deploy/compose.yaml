services:
  reply:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ${REPLY_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REPLY_DATA_DIR: /data
      TRUST_PROXY: 'true'
    volumes:
      - reply-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    env_file: ${REPLY_ENV_FILE:-.env}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      reply:
        condition: service_healthy
volumes:
  reply-data:
  caddy-data:
  caddy-config:
